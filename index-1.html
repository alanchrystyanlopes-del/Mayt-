<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Link</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
}

/* ── FUNDO ── */
.bg {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 0;
}
.bg::before {
  content:'';
  position:absolute;
  width:500px; height:500px;
  background: radial-gradient(circle, rgba(254,44,85,.18) 0%, transparent 70%);
  top:-120px; left:-120px;
  animation: d1 9s ease-in-out infinite alternate;
}
.bg::after {
  content:'';
  position:absolute;
  width:500px; height:500px;
  background: radial-gradient(circle, rgba(32,213,236,.14) 0%, transparent 70%);
  bottom:-120px; right:-120px;
  animation: d2 11s ease-in-out infinite alternate;
}
@keyframes d1 { to { transform: translate(70px,90px); } }
@keyframes d2 { to { transform: translate(-70px,-90px); } }

/* ── MAIN SCREEN ── */
#mainScreen {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 36px;
  transition: opacity .3s;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo-text {
  font-size: 26px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -.5px;
}

.btn-wrap { position: relative; }

.shadow-c {
  position: absolute; inset: 0;
  border-radius: 50px;
  background: #20d5ec;
  transform: translate(-4px,-4px);
  transition: transform .15s;
}
.shadow-r {
  position: absolute; inset: 0;
  border-radius: 50px;
  background: #fe2c55;
  transform: translate(4px,4px);
  transition: transform .15s;
}
.btn-wrap:hover .shadow-c { transform: translate(-7px,-7px); }
.btn-wrap:hover .shadow-r { transform: translate(7px,7px); }

.main-btn {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 12px;
  background: #fff;
  color: #000;
  border: none;
  border-radius: 50px;
  padding: 18px 52px;
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
  letter-spacing: .2px;
  transition: transform .15s;
}
.main-btn:active { transform: scale(.97); }

/* ── OVERLAY ── */
#overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.8);
  backdrop-filter: blur(12px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 50;
}
#overlay.show { display: flex; }

/* ── MINI BROWSER ── */
.browser {
  width: 92%;
  max-width: 400px;
  background: #1c1c1e;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 40px 100px rgba(0,0,0,.9);
  animation: popIn .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn {
  from { transform: scale(.75) translateY(30px); opacity: 0; }
  to   { transform: scale(1)   translateY(0);    opacity: 1; }
}

/* chrome */
.b-chrome {
  background: #2c2c2e;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.tls { display: flex; gap: 6px; flex-shrink: 0; }
.tl {
  width: 12px; height: 12px;
  border-radius: 50%;
  opacity: .85;
}
.tl-r { background: #ff5f57; }
.tl-y { background: #ffbd2e; }
.tl-g { background: #28ca41; }
.addr {
  flex: 1;
  background: rgba(255,255,255,.07);
  border-radius: 7px;
  padding: 5px 10px;
  font-size: 10.5px;
  color: rgba(255,255,255,.55);
  display: flex;
  align-items: center;
  gap: 6px;
  overflow: hidden;
  font-family: "SF Mono", Menlo, monospace;
}
.addr-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* content */
.b-content {
  min-height: 290px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 28px 22px;
}

/* loading */
#loadState {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.spinner {
  width: 34px; height: 34px;
  border: 3px solid rgba(255,255,255,.1);
  border-top-color: #fe2c55;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loadState p {
  font-size: 12px;
  color: rgba(255,255,255,.35);
}

/* safety page sim */
#pageState {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  width: 100%;
  text-align: center;
}

.safe-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 17px;
  font-weight: 800;
  color: #fff;
}
.safe-title {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  line-height: 1.4;
}
.safe-sub {
  font-size: 12px;
  color: rgba(255,255,255,.45);
  margin-top: -10px;
}
.dest-box {
  width: 100%;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 12px;
  color: #20d5ec;
  font-family: monospace;
  word-break: break-all;
  text-align: left;
}

#redBtn {
  width: 100%;
  background: #fe2c55;
  color: #fff;
  border: none;
  border-radius: 30px;
  padding: 15px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: .3px;
  transition: transform .1s, box-shadow .2s;
}
#redBtn.pulse {
  animation: btnPulse .25s ease forwards;
  box-shadow: 0 0 0 6px rgba(254,44,85,.35);
}
@keyframes btnPulse {
  0%   { transform: scale(1); }
  40%  { transform: scale(.93); }
  100% { transform: scale(1); }
}

/* status bar */
.b-status {
  background: rgba(255,255,255,.02);
  border-top: 1px solid rgba(255,255,255,.05);
  padding: 7px 14px;
  font-size: 10px;
  color: rgba(255,255,255,.25);
  min-height: 26px;
  display: flex;
  align-items: center;
}

/* ── AUTO CURSOR ── */
#autoCursor {
  position: fixed;
  font-size: 26px;
  pointer-events: none;
  z-index: 200;
  opacity: 0;
  transition:
    left .7s cubic-bezier(.25,.46,.45,.94),
    top  .7s cubic-bezier(.25,.46,.45,.94),
    opacity .3s;
  transform-origin: top left;
  line-height: 1;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,.8));
}
#autoCursor.visible { opacity: 1; }

/* success flash */
#successFlash {
  position: fixed;
  inset: 0;
  background: rgba(32,213,236,.12);
  z-index: 999;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
}
#successFlash.flash { opacity: 1; }
</style>
</head>
<body>

<div class="bg"></div>

<!-- MAIN SCREEN -->
<div id="mainScreen">
  <!-- Logo -->
  <div class="logo">
    <svg width="34" height="34" viewBox="0 0 48 48" fill="none">
      <path d="M34 6c.7 4.2 3.2 7 7 8v6c-2.5 0-4.8-.7-7-2v13c0 7.2-5.8 13-13 13S8 38.2 8 31s5.8-13 13-13c.7 0 1.3.1 2 .2V25c-.7-.2-1.3-.3-2-.3-3.9 0-7 3.1-7 7s3.1 7 7 7 7-3.1 7-7V6h6z" fill="#fff"/>
    </svg>
    <span class="logo-text">TikTok</span>
  </div>

  <!-- Button -->
  <div class="btn-wrap">
    <div class="shadow-c"></div>
    <div class="shadow-r"></div>
    <button class="main-btn" onclick="start(event)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#000"><path d="M8 5v14l11-7z"/></svg>
      Abrir no TikTok
    </button>
  </div>
</div>

<!-- OVERLAY -->
<div id="overlay">
  <div class="browser">
    <!-- Chrome -->
    <div class="b-chrome">
      <div class="tls">
        <span class="tl tl-r"></span>
        <span class="tl tl-y"></span>
        <span class="tl tl-g"></span>
      </div>
      <div class="addr">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2.5">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span class="addr-text" id="addrText">tiktoklinksafety.com</span>
      </div>
    </div>

    <!-- Content -->
    <div class="b-content">

      <!-- Loading -->
      <div id="loadState">
        <div class="spinner"></div>
        <p>Carregando página...</p>
      </div>

      <!-- Safety page -->
      <div id="pageState">
        <div class="safe-logo">
          <svg width="22" height="22" viewBox="0 0 48 48" fill="none">
            <path d="M34 6c.7 4.2 3.2 7 7 8v6c-2.5 0-4.8-.7-7-2v13c0 7.2-5.8 13-13 13S8 38.2 8 31s5.8-13 13-13c.7 0 1.3.1 2 .2V25c-.7-.2-1.3-.3-2-.3-3.9 0-7 3.1-7 7s3.1 7 7 7 7-3.1 7-7V6h6z" fill="#fff"/>
          </svg>
          TikTok
        </div>
        <p class="safe-title">Você está saindo do TikTok</p>
        <p class="safe-sub">Este link vai te redirecionar para um site externo.</p>
        <div class="dest-box" id="destBox">beacons.ai/maitelinks</div>
        <button id="redBtn" onclick="manualClick()">Continuar &rarr;</button>
      </div>

    </div>

    <!-- Status -->
    <div class="b-status" id="statusBar">Conectando...</div>
  </div>
</div>

<!-- Auto cursor -->
<div id="autoCursor">👆</div>

<!-- Flash -->
<div id="successFlash"></div>

<script>
const codes = [
  "ad","ae","af","ag","ai","al","am","ao","aq","ar","as","at","au","aw","ax","az",
  "ba","bb","bd","be","bf","bg","bh","bi","bj","bl","bm","bn","bo","bq","br","bs",
  "bt","bv","bw","by","bz","ca","cc","cd","cf","cg","ch","ci","ck","cl","cm","cn",
  "co","cr","cu","cv","cw","cx","cy","cz","de","dj","dk","dm","do","dz","ec","ee",
  "eg","eh","er","es","et","fi","fj","fk","fm","fo","fr","ga","gb","gd","ge","gf",
  "gg","gh","gi","gl","gm","gn","gp","gq","gr","gs","gt","gu","gw","gy","hk","hm",
  "hn","hr","ht","hu","id","ie","il","im","in","io","iq","ir","is","it","je","jm",
  "jo","jp","ke","kg","kh","ki","km","kn","kp","kr","kw","ky","kz","la","lb","lc",
  "li","lk","lr","ls","lt","lu","lv","ly","ma","mc","md","me","mf","mg","mh","mk",
  "ml","mm","mn","mo","mp","mq","mr","ms","mt","mu","mv","mw","mx","my","mz","na",
  "nc","ne","nf","ng","ni","nl","no","np","nr","nu","nz","om","pa","pe","pf","pg",
  "ph","pk","pl","pm","pn","pr","ps","pt","pw","py","qa","re","ro","rs","ru","rw",
  "sa","sb","sc","sd","se","sg","sh","si","sj","sk","sl","sm","sn","so","sr","ss",
  "st","sv","sx","sy","sz","tc","td","tf","tg","th","tj","tk","tl","tm","tn","to",
  "tr","tt","tv","tw","tz","ua","ug","um","us","uy","uz","va","vc","ve","vg","vi",
  "vn","vu","wf","ws","ye","yt","za","zm","zw"
];

const TARGET = 'https://beacons.ai/maitelinks';

function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function start() {
  const code = rand(codes);
  const safeUrl = `https://www.tiktoklinksafety.com/link/?aid=1233&lang=${code}&scene=link_sticker&jumper_version=1&target=${encodeURIComponent(TARGET)}`;

  // Reset UI
  document.getElementById('loadState').style.display = 'flex';
  document.getElementById('pageState').style.display = 'none';
  document.getElementById('addrText').textContent = `tiktoklinksafety.com/link/?lang=${code}&...`;
  document.getElementById('statusBar').textContent = 'Conectando...';
  document.getElementById('autoCursor').classList.remove('visible');

  // Show overlay
  document.getElementById('overlay').classList.add('show');

  // Phase 1: loading → status update
  setTimeout(() => {
    document.getElementById('statusBar').textContent = `Carregado · lang=${code}`;
  }, 900);

  // Phase 2: show safety page
  setTimeout(() => {
    document.getElementById('loadState').style.display = 'none';
    document.getElementById('pageState').style.display = 'flex';
    document.getElementById('statusBar').textContent = 'Aguardando interação...';

    // Phase 3: move cursor to button and click
    setTimeout(() => {
      moveCursorAndClick();
    }, 700);

  }, 1800);
}

function moveCursorAndClick() {
  const cursor  = document.getElementById('autoCursor');
  const btn     = document.getElementById('redBtn');
  const btnRect = btn.getBoundingClientRect();

  // Start position: bottom-right of viewport
  cursor.style.left = (window.innerWidth  * 0.82) + 'px';
  cursor.style.top  = (window.innerHeight * 0.82) + 'px';
  cursor.style.transition = 'opacity .3s';
  cursor.classList.add('visible');

  // Move to button center after cursor appears
  setTimeout(() => {
    cursor.style.transition =
      'left .65s cubic-bezier(.25,.46,.45,.94), top .65s cubic-bezier(.25,.46,.45,.94), opacity .3s';
    cursor.style.left = (btnRect.left + btnRect.width / 2 - 8) + 'px';
    cursor.style.top  = (btnRect.top  + btnRect.height / 2 - 8) + 'px';
    document.getElementById('statusBar').textContent = 'Clicando automaticamente...';
  }, 350);

  // Click animation + open link
  setTimeout(() => {
    btn.classList.add('pulse');
    setTimeout(() => {
      openFinal();
    }, 280);
  }, 1100);
}

function openFinal() {
  // Flash
  const flash = document.getElementById('successFlash');
  flash.classList.add('flash');
  setTimeout(() => flash.classList.remove('flash'), 300);

  // Open link
  window.open(TARGET, '_blank');

  // Close overlay
  setTimeout(() => {
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('autoCursor').classList.remove('visible');
    document.getElementById('redBtn').classList.remove('pulse');
  }, 450);
}

// Allow manual click too
function manualClick() {
  openFinal();
}
</script>

</body>
</html>
