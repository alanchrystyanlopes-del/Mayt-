<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mayte Privacy</title>
<style>
  :root{
    --bg: #f6ecf6;
    --card-bg: #fdf6fb;
    --ink: #3a1f3d;
    --ink-soft: #6b4a70;
    --accent: #c9438f;
    --accent-deep: #8a2c66;
    --border: #2c1330;
    --shadow: rgba(138, 44, 102, 0.25);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(255,182,225,0.35), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(201,67,143,0.18), transparent 45%);
    font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    min-height: 100vh;
  }

  .page{
    max-width: 460px;
    margin: 0 auto;
    padding: 36px 18px 60px;
  }

  .brand{
    text-align:center;
    margin-bottom: 28px;
  }

  .brand .name{
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--accent-deep);
    margin: 0;
  }

  .brand .tag{
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  a.card-link{
    text-decoration: none;
    color: inherit;
    display:block;
  }

  .card{
    position: relative;
    display:flex;
    align-items: stretch;
    background: var(--card-bg);
    border: 2px solid var(--border);
    border-radius: 22px;
    overflow: hidden;
    margin-bottom: 26px;
    box-shadow: 0 10px 24px var(--shadow);
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    cursor: pointer;
  }

  .card:active{
    transform: translateY(-1px) scale(0.995) !important;
  }

  .card.floaty{
    animation: floaty 3.4s ease-in-out infinite;
  }

  .card.floaty:nth-of-type(2){
    animation-delay: -1.7s;
  }

  @keyframes floaty{
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(-0.6deg); }
  }

  .card.floaty:hover{
    animation-play-state: paused;
    transform: translateY(-14px) scale(1.02);
    box-shadow: 0 20px 36px var(--shadow);
    border-color: var(--accent);
  }

  .card.whats{
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }

  .card.whats:hover{
    transform: translateY(-6px) scale(1.015);
    box-shadow: 0 18px 34px var(--shadow);
    border-color: #25D366;
  }

  .card-media{
    width: 42%;
    min-height: 190px;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
  }

  .card-media img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display:block;
    transition: transform 0.5s ease, filter 0.5s ease;
  }

  .card:hover .card-media img{
    transform: scale(1.08);
    filter: saturate(1.1) brightness(1.03);
  }

  .card-media::after{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(90deg, transparent 70%, rgba(253,246,251,0.9) 100%);
    pointer-events:none;
  }

  .card-body{
    flex:1;
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 18px 14px;
    gap: 10px;
  }

  .card-title{
    font-size: 19px;
    font-weight: 700;
    line-height: 1.35;
    color: var(--accent-deep);
    margin:0;
  }

  .emoji{
    display:inline-block;
    transition: transform 0.3s ease;
  }

  .card:hover .emoji{
    animation: wiggle 0.6s ease;
  }

  @keyframes wiggle{
    0%{ transform: rotate(0deg) scale(1); }
    30%{ transform: rotate(-14deg) scale(1.25); }
    60%{ transform: rotate(12deg) scale(1.25); }
    100%{ transform: rotate(0deg) scale(1); }
  }

  .card-sub{
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0.4px;
    margin:0;
  }

  .badge{
    margin-top: 4px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.6px;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    padding: 5px 14px;
    border-radius: 999px;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .card:hover .badge{
    transform: scale(1.06);
    box-shadow: 0 4px 12px rgba(138,44,102,0.4);
  }

  /* WhatsApp card variant */
  .card.whats{
    background: #fdf6fb;
  }

  .whats-icon-wrap{
    width: 42%;
    min-height: 190px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle, rgba(37,211,102,0.14), transparent 70%);
  }

  .whats-icon{
    width: 108px;
    height: 108px;
    border-radius: 50%;
    background: #25D366;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 10px 22px rgba(37,211,102,0.45);
    animation: whatsapp-buzz 2.6s ease-in-out infinite;
  }

  .whats-icon svg{
    width: 56px;
    height: 56px;
    fill: #fff;
  }

  @keyframes whatsapp-buzz{
    0%, 76%, 100% { transform: translate(0,0) rotate(0deg); }
    78%  { transform: translate(-2px,0) rotate(-6deg); }
    80%  { transform: translate(2px,0) rotate(6deg); }
    82%  { transform: translate(-2px,0) rotate(-5deg); }
    84%  { transform: translate(2px,0) rotate(5deg); }
    86%  { transform: translate(-1px,0) rotate(-3deg); }
    88%  { transform: translate(1px,0) rotate(3deg); }
    90%  { transform: translate(0,0) rotate(0deg); }
  }

  .card.whats:hover .whats-icon{
    animation: whatsapp-buzz 0.5s ease-in-out infinite;
    box-shadow: 0 14px 28px rgba(37,211,102,0.6);
  }

  .card.whats .card-title{
    color: #1f7a44;
  }

  .card.whats .badge{
    background: linear-gradient(135deg, #25D366, #1a8f4c);
  }

  footer{
    text-align:center;
    margin-top: 8px;
    font-size: 11px;
    color: var(--ink-soft);
    opacity: 0.7;
  }

  @media (prefers-reduced-motion: reduce){
    .card, .card-media img, .emoji, .badge, .whats-icon{
      transition: none;
      animation: none !important;
    }
  }
</style>
</head>
